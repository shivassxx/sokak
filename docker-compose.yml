services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - STATS_TOKEN=${STATS_TOKEN:-}
    volumes:
      - app_data:/app/data
    expose:
      - "2567"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env, e.g. DOMAIN=saklambac.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
