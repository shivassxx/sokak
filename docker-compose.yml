services:
  app:
    build:
      context: .
      args:
        - VITE_TURN_URL=${VITE_TURN_URL:-}
        - VITE_TURN_USER=${VITE_TURN_USER:-}
        - VITE_TURN_PASS=${VITE_TURN_PASS:-}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - STATS_TOKEN=${STATS_TOKEN:-}
      - SOKAK_OWNER_PASSWORD=${SOKAK_OWNER_PASSWORD:-}
      - STAFF_FILE=${STAFF_FILE:-/app/data/staff.json}
    volumes:
      - app_data:/app/data
    expose:
      - "2567"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env, e.g. DOMAIN=okey.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
