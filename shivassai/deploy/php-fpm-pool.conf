; /etc/php/8.3/fpm/pool.d/shivassai.conf
[shivassai]
user = shivassai
group = shivassai

listen = /run/php/php8.3-fpm-shivassai.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Only the front controller may run
security.limit_extensions = .php

php_admin_value[open_basedir] = /var/www/shivassai:/tmp
php_admin_value[upload_max_filesize] = 40M
php_admin_value[post_max_size] = 48M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/www/shivassai/storage/logs/php-error.log
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
