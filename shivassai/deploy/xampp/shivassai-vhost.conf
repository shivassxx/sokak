# shivassai on XAMPP — included from C:\xampp\apache\conf\httpd.conf
# Site: http://localhost:8080  (only public/ is served)
Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/xampp/shivassai/public"

    <Directory "C:/xampp/shivassai/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/shivassai-error.log"
    CustomLog "logs/shivassai-access.log" common
</VirtualHost>
